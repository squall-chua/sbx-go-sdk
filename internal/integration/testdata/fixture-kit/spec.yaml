# A minimal v2 mixin for the validate, inspect, pack and signing tests.
#
# It stays v2 because `kit sign` cannot load a v3 kit at sbx v0.51.0. Since
# v0.51.0 `kit add` cannot use it either: a v2 mixin cannot join the v3 kit a
# built-in agent now runs from. TestSmoke_AddKitRecordsAbsolutePath therefore
# adds ../fixture-kit-v3 instead.
#
# sbx v0.38.0 gave schemaVersion "2" a decoder of its own, so the v1 key names
# no longer parse under it: caps -> permissions, commands -> setup,
# commands.initFiles -> setup.files, agentContext -> agentInstructions.
# sbx v0.39.0 then made `kit inspect --json` report that same v2 shape, flat
# and with no manifest wrapper, so kit.Info mirrors the keys used here.
schemaVersion: "2"
kind: mixin
name: fixture-kit
version: 0.1.0
description: fixture for sbx-go-sdk integration tests
environment:
  variables:
    SBX_GO_SDK_FIXTURE: "1"
permissions:
  network:
    allow:
      - api.example.com
