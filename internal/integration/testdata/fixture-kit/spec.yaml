# A minimal kit that `sbx kit add` accepts.
#
# DO NOT add credentials, publishedPorts, volumes, setup.startup or
# setup.files here. The kit-add recreate flow refuses all five pre-flight, and
# TestSmoke_AddKitRecordsAbsolutePath would then fail for a reason unrelated to
# what it tests.
#
# sbx v0.38.0 gave schemaVersion "2" a decoder of its own, so the v1 key names
# no longer parse under it: caps -> permissions, commands -> setup,
# commands.initFiles -> setup.files, agentContext -> agentInstructions.
# sbx v0.39.0 then made `kit inspect --json` report that same v2 shape, flat
# and with no manifest wrapper, so kit.Info mirrors the keys used here.
schemaVersion: "2"
kind: mixin
name: fixture-kit
version: 0.1.0
description: fixture for sbx-go-sdk integration tests
environment:
  variables:
    SBX_GO_SDK_FIXTURE: "1"
permissions:
  network:
    allow:
      - api.example.com
